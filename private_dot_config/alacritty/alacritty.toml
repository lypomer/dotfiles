[general]
import = ["~/.config/alacritty/catpuccin-espresso.toml"]
live_config_reload = true

[window]
opacity = 0.9
blur=true
decorations = "None"
startup_mode = "Maximized"

  [window.padding]
  x = 10
  y = 10

[font]
size = 10
normal = {family = "MesloLGS Nerd Font Propo", style = "Regular"}

[cursor]
  [cursor.style]
  shape = "Block"
  blinking = "Always"

  [cursor.vi_mode_style]
  shape = "Block"
  blinking = "Always"

[mouse]
hide_when_typing = true

[terminal]
shell="/usr/bin/zsh"
