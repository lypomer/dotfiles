format = '$os$all$cmd_duration$fill$gcloud$kubernetes$line_break$character'

[aws]
symbol = "  "

[battery]
full_symbol = '🔋 '
charging_symbol = '🔌 '
discharging_symbol = '💀 '

[[battery.display]]
threshold = 30
style = 'bold bright-black'

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"

[docker_context]
symbol = " "
only_with_files = true
detect_files = [ "docker-compose.yml", "docker-compose.yaml", "Dockerfile", "compose.yaml", "compose.yml" ]
detect_folders = [ "docker" ]
disabled = false

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fill]
symbol=" "

[fossil_branch]
symbol = " "

[gcloud]
symbol = ' '
# format = '[$symbol($project)(\($region\))]($style) '
format = '[$symbol($project)]($style) '
style = "blue"
disabled = false

[gcloud.region_aliases]
europe-west1 = 'eu-west1'

[git_branch]
# symbol = " "
style = "bold green"

[git_commit]
commit_hash_length = 4
tag_disabled = false
tag_symbol = ' 🔖'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold bright-black'
# conflicted = "💀"
# conflicted = " "
conflicted = " "
ahead = ' ${count}'
behind = ' ${count}'
diverged = ' ${ahead_count} ${behind_count}'
staged = ' '
# stashed = '🎒'
stashed = ' '
modified = ' '
deleted = ' '
renamed = ' '
untracked = ' '

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[helm]
detect_files = ['values.yaml.gotmpl', 'helmfile.yaml', 'Chart.yaml']
disabled = true

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[kubernetes]
format = '[/](dimmed black) [$symbol$context | 󱁐 $namespace](purple) '
disabled = false
# detect_env_vars = ['STARSHIP_KUBE_TERMINAL']

[[kubernetes.contexts]]
# Using capture groups
# Contexts from GKE, AWS and other cloud providers usually carry additional information, like the region/zone.
# The following entry matches on the GKE format (`gke_projectname_zone_cluster-name`)
# and renames every matching kube context into a more readable format (`gke-cluster-name`):
context_pattern = "gke_ornikar-(?P<project>[\\w-]+)_.*_(?P<cluster>[\\w-]+)"
context_alias = "$project"

